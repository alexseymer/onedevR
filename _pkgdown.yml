url: https://alexseymer.github.io/onedevR/
template:
  bootstrap: 5
  light-switch: true

home:
  title: onedevR — R client for the OneDev REST API
  links:
    - text: Browse source code
      href: https://github.com/alexseymer/onedevR
    - text: Report a bug
      href: https://github.com/alexseymer/onedevR/issues

reference:
  - title: Connection
    desc: Configure how onedevr talks to your OneDev instance.
    contents:
      - od_connection
      - od_set_connection
      - od_get_connection
      - od_get_config
  - title: Issues
    contents:
      - starts_with("od_query_issues")
      - starts_with("od_get_issue")
      - starts_with("od_create_issue")
      - starts_with("od_add_issue")
      - starts_with("od_issue_")
      - od_resolve_issue_id
      - od_list_iterations
      - od_add_issue_iterations
  - title: Projects & low-level
    contents:
      - od_query_projects
      - od_list_projects
      - od_get_project
      - od_get_project_clone_url
      - od_resolve_project_path
      - od_resolve_project_id
      - od_as_tibble
      - od_request
      - od_download
  - title: Users
    contents:
      - od_query_users
      - od_get_user
      - od_get_me
      - od_resolve_user_id
      - od_get_user_emails
  - title: Builds
    contents:
      - od_query_builds
      - od_get_build
      - od_get_build_params
      - od_get_build_log
      - od_list_build_artifacts
      - od_download_build_artifact
      - od_resolve_build_id
  - title: Pull requests
    contents:
      - starts_with("od_query_pull")
      - starts_with("od_get_pull")
      - starts_with("od_create_pull")
      - starts_with("od_add_pull")
      - starts_with("od_approve_pull")
      - starts_with("od_request_pull")
      - starts_with("od_merge_pull")
      - starts_with("od_discard_pull")
      - od_resolve_pull_request_id

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github, lightswitch]
  components:
    github:
      icon: fab fa-github
      href: https://github.com/alexseymer/onedevR
      aria-label: GitHub

authors:
  Alex Seymer:
    href: https://github.com/alexseymer
