home:
  title: onedevR — R client for the OneDev REST API
  links:
    - text: Browse source code
      href: https://github.com/alexseymer/onedevR
    - text: Report a bug
      href: https://github.com/alexseymer/onedevR/issues

reference:
  - title: Connection
    desc: Configure how onedevr talks to your OneDev instance (env, explicit connection, Basic Auth or Bearer).
    contents:
      - od_connection
      - od_set_connection
      - od_get_connection
      - od_get_config
  - title: Issues
    desc: Query and mutate issues, fields, comments, boards, and iterations.
    contents:
      - starts_with("od_query_issues")
      - starts_with("od_get_issue")
      - starts_with("od_create_issue")
      - starts_with("od_add_issue")
      - starts_with("od_issue_")
      - od_resolve_issue_id
      - od_list_boards
      - od_get_board
      - od_query_board_issues
      - od_list_iterations
      - od_resolve_iteration_ids
      - od_get_iteration
      - od_add_issue_iterations
  - title: Builds and jobs
    desc: Query builds, logs, artifacts, and run/rebuild/cancel jobs.
    contents:
      - od_query_builds
      - od_get_build
      - od_get_build_params
      - od_get_build_log
      - od_list_build_artifacts
      - od_download_build_artifact
      - od_resolve_build_id
      - od_run_job
      - od_rebuild_job
      - od_cancel_job
  - title: Pull requests
    desc: List, review, and write pull requests.
    contents:
      - starts_with("od_query_pull")
      - starts_with("od_get_pull")
      - starts_with("od_create_pull")
      - starts_with("od_add_pull")
      - starts_with("od_approve_pull")
      - starts_with("od_request_pull")
      - starts_with("od_merge_pull")
      - starts_with("od_discard_pull")
      - od_resolve_pull_request_id
  - title: Projects
    desc: Resolve and inspect OneDev projects.
    contents:
      - od_query_projects
      - od_get_project
      - od_get_project_setting
      - od_get_project_clone_url
      - od_resolve_project_path
      - od_resolve_project_id
  - title: Users
    contents:
      - od_query_users
      - od_get_user
      - od_get_me
      - od_whoami
      - od_resolve_user_id
      - od_get_user_emails
  - title: Packages
    contents:
      - od_query_packages
      - od_get_pack
      - od_get_pack_blobs
      - od_get_pack_labels
  - title: Repository
    desc: Branches, tags, commits, and file contents.
    contents:
      - od_list_branches
      - od_get_branch
      - od_get_default_branch
      - od_list_tags
      - od_get_tag
      - od_query_commits
      - od_get_commit
      - od_get_file
      - od_get_file_text
  - title: Utilities
    desc: Tibbles, pagination, query DSL help, downloads, and the low-level HTTP escape hatch.
    contents:
      - od_as_tibble
      - od_paginate
      - od_get_query_description
      - od_download
      - od_request
  - title: Groups
    contents:
      - od_query_groups
      - od_get_group
      - od_list_group_members
      - od_add_group_member
      - od_remove_group_member
  - title: "Experimental: webhooks and SSH keys"
    desc: Not yet verified against a live OneDev server; interface and behaviour may change.
    contents:
      - od_list_webhooks
      - od_get_webhook
      - od_create_webhook
      - od_delete_webhook
      - od_list_user_ssh_keys
      - od_add_user_ssh_key
      - od_delete_user_ssh_key
  - title: Commit statuses, build promotion, and issue/PR links
    contents:
      - od_get_commit_statuses
      - od_set_commit_status
      - od_promote_build
      - od_link_issue_to_pull_request
      - od_unlink_issue_from_pull_request
  - title: "Experimental: batch, parallel, and streaming"
    desc: Bulk issue operations, concurrent helpers, and streaming of long results or logs. Not yet verified against a live OneDev server.
    contents:
      - od_batch_create_issues
      - od_batch_update_issues
      - od_batch_transition_issues
      - od_batch_link_issues_prs
      - od_map_parallel
      - od_parallel_query
      - od_chunked_foreach
      - od_concurrent_stream
      - od_stream_query_results
      - od_stream_build_log
      - od_write_log_file
      - is_future_installed
  - title: "Experimental: caching"
    desc: Opt-in response cache. Not yet verified against a live OneDev server.
    contents:
      - od_enable_cache
      - od_disable_cache
      - od_clear_cache
      - od_get_cache_stats
      - od_with_cache

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github, lightswitch]
  components:
    github:
      icon: fab fa-github
      href: https://github.com/alexseymer/onedevR
      aria-label: GitHub

authors:
  Alex Seymer:
    href: https://github.com/alexseymer
