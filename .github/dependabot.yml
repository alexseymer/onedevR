# Dependabot does not support R packages; the OSV audit in
# .github/workflows/security.yaml covers those. This keeps the GitHub Actions
# used by the workflows up to date.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    open-pull-requests-limit: 5
