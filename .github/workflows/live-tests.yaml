# Live integration tests against a real OneDev instance.
#
# Runs on demand and weekly, never on pull requests, so untrusted code never
# receives the secrets below. Use a dedicated test instance or project: the
# write test is only enabled when ONEDEV_LIVE_ALLOW_WRITES is set, and it is
# set here, so point ONEDEV_PROJECT_PATH at a disposable project.
#
# Required repository secrets:
#   ONEDEV_HOST, ONEDEV_API_TOKEN, ONEDEV_PROJECT_PATH, ONEDEV_PROJECT_ID
on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'

name: Live tests

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    env:
      ONEDEV_HOST: ${{ secrets.ONEDEV_HOST }}
      ONEDEV_API_TOKEN: ${{ secrets.ONEDEV_API_TOKEN }}
      ONEDEV_PROJECT_PATH: ${{ secrets.ONEDEV_PROJECT_PATH }}
      ONEDEV_PROJECT_ID: ${{ secrets.ONEDEV_PROJECT_ID }}
      ONEDEV_RUN_LIVE_TESTS: '1'
      ONEDEV_LIVE_ALLOW_WRITES: '1'

    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        shell: bash
        run: |
          for v in ONEDEV_HOST ONEDEV_API_TOKEN ONEDEV_PROJECT_PATH ONEDEV_PROJECT_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret $v is not set; live tests need a test OneDev instance."
              exit 1
            fi
          done

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgload, any::testthat, any::mockery, any::withr
          needs: test

      - name: Run live tests
        shell: bash
        run: |
          Rscript -e 'testthat::test_dir("tests/testthat", filter = "live", package = "onedevr", load_package = "source", stop_on_failure = TRUE, reporter = "summary")'
